### Merge the Qwen2.5-1.5B MIMIC-III top-50 naive SFT LoRA adapter
### into a full model. The merged checkpoint is the SFT base that EasyR1
### GRPO Stage 2 uses (set SFT_MODEL_PATH to point at export_dir).

### model
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
adapter_name_or_path: saves/qwen2.5-1.5b/lora/icd_naive_sft_mimic3_top50
template: qwen
trust_remote_code: true

### export
export_dir: outputs/qwen2.5-1.5b/icd_naive_sft_mimic3_top50
export_size: 5
export_device: cpu
export_legacy_format: false
